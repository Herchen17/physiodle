<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physiodle Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafb; color: #1a1a2e; }

    /* ── Nav ── */
    .admin-nav { background: #0d9488; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 24px; position: sticky; top: 0; z-index: 100; }
    .admin-nav h1 { font-size: 20px; font-weight: 700; }
    .admin-nav .tabs { display: flex; gap: 4px; }
    .admin-nav .tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; background: rgba(255,255,255,0.15); color: #fff; border: none; transition: background 0.2s; }
    .admin-nav .tab:hover { background: rgba(255,255,255,0.25); }
    .admin-nav .tab.active { background: #fff; color: #0d9488; }
    .admin-nav .logout { margin-left: auto; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; background: rgba(255,255,255,0.15); color: #fff; border: none; }

    /* ── Login ── */
    .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 90%; }
    .login-box h2 { color: #0d9488; margin-bottom: 8px; }
    .login-box p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; margin-bottom: 16px; }
    .login-box input:focus { outline: none; border-color: #0d9488; }
    .login-box button { width: 100%; padding: 12px; background: #0d9488; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .login-box .error { color: #e53e3e; font-size: 13px; margin-top: 8px; }

    /* ── Panels ── */
    .panel { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
    .panel.active { display: block; }

    /* ── Stats Cards ── */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .stat-card .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #0d9488; }

    /* ── Tables ── */
    .table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); overflow: hidden; margin-bottom: 24px; }
    .table-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; }
    .table-header h3 { font-size: 16px; font-weight: 600; }
    .table-scroll { max-height: 600px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { position: sticky; top: 0; background: #f8fafb; padding: 10px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 0.5px; border-bottom: 1px solid #eee; }
    td { padding: 10px 16px; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
    tr:hover td { background: #f8fffe; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-blue { background: #dbeafe; color: #1e40af; }

    /* ── Pagination ── */
    .pagination { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid #f0f0f0; justify-content: center; }
    .pagination button { padding: 6px 14px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination button.active { background: #0d9488; color: #fff; border-color: #0d9488; }
    .pagination .page-info { font-size: 13px; color: #888; }

    /* ── Puzzle Vetting ── */
    .puzzle-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .puzzle-nav button { padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 500; }
    .puzzle-nav button:hover { background: #f0fdfa; border-color: #0d9488; }
    .puzzle-nav .day-input { padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; width: 100px; text-align: center; }
    .puzzle-nav .day-input:focus { outline: none; border-color: #0d9488; }
    .puzzle-nav .current-info { font-size: 13px; color: #888; }

    .puzzle-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); padding: 24px; margin-bottom: 16px; }
    .puzzle-card .puzzle-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .puzzle-card .puzzle-title { font-size: 20px; font-weight: 700; color: #0d9488; }
    .puzzle-card .puzzle-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .puzzle-card .clue { padding: 12px 16px; border-left: 3px solid #0d9488; background: #f8fffe; border-radius: 0 8px 8px 0; margin-bottom: 8px; }
    .puzzle-card .clue-label { font-size: 12px; font-weight: 600; color: #0d9488; text-transform: uppercase; margin-bottom: 2px; }
    .puzzle-card .clue-text { font-size: 14px; color: #333; line-height: 1.5; }
    .puzzle-card .explanation { margin-top: 16px; padding: 12px 16px; background: #f0fdfa; border-radius: 8px; font-size: 13px; color: #555; line-height: 1.5; }
    .puzzle-card .aliases { margin-top: 8px; font-size: 13px; color: #888; }

    .puzzle-pair-warning { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #92400e; }
    .puzzle-pair-warning strong { color: #78350f; }

    /* ── Jump to date ── */
    .jump-controls { display: flex; gap: 8px; align-items: center; }
    .jump-controls input[type="date"] { padding: 6px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    .jump-controls input[type="date"]:focus { outline: none; border-color: #0d9488; }
  </style>
</head>
<body>

<!-- ── Login Screen ── -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>Physiodle Admin</h2>
    <p>Enter your admin key to continue</p>
    <input type="password" id="adminKeyInput" placeholder="Admin key..." autocomplete="off">
    <button onclick="doLogin()">Login</button>
    <div id="loginError" class="error" style="display:none"></div>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard" style="display:none">
  <nav class="admin-nav">
    <h1>🦴 Physiodle Admin</h1>
    <div class="tabs">
      <button class="tab active" data-panel="overview">Overview</button>
      <button class="tab" data-panel="puzzles">Puzzle Vetting</button>
      <button class="tab" data-panel="users">Users</button>
      <button class="tab" data-panel="games">Game History</button>
    </div>
    <button class="logout" onclick="doLogout()">Logout</button>
  </nav>

  <!-- ── Overview Panel ── -->
  <div id="panel-overview" class="panel active">
    <h2 style="margin-bottom:16px">Dashboard Overview</h2>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <!-- ── Puzzle Vetting Panel ── -->
  <div id="panel-puzzles" class="panel">
    <h2 style="margin-bottom:16px">Puzzle Vetting</h2>
    <div class="puzzle-nav">
      <button onclick="puzzleNav(-10)">⟨⟨ -10</button>
      <button onclick="puzzleNav(-1)">⟨ Prev</button>
      <span>Day</span>
      <input type="number" class="day-input" id="dayInput" min="1" value="1" onchange="jumpToDay(this.value)">
      <button onclick="puzzleNav(1)">Next ⟩</button>
      <button onclick="puzzleNav(10)">+10 ⟩⟩</button>
      <span style="margin-left:8px">|</span>
      <div class="jump-controls">
        <span>Jump to date:</span>
        <input type="date" id="dateJump" onchange="jumpToDate(this.value)">
      </div>
      <button onclick="jumpToDay(state.currentDay)" style="background:#0d9488;color:#fff;border-color:#0d9488">Today</button>
      <span class="current-info" id="puzzleDayInfo"></span>
    </div>
    <div id="puzzleContainer"></div>
  </div>

  <!-- ── Users Panel ── -->
  <div id="panel-users" class="panel">
    <h2 style="margin-bottom:16px">Users</h2>
    <div class="table-wrap">
      <div class="table-header">
        <h3>All Users</h3>
        <span id="userTotal" style="font-size:13px;color:#888"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>ID</th><th>Username</th><th>Joined</th><th>Games</th><th>Won</th><th>Win %</th><th>Points</th>
          </tr></thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="userPagination"></div>
    </div>
  </div>

  <!-- ── Games Panel ── -->
  <div id="panel-games" class="panel">
    <h2 style="margin-bottom:16px">Game History</h2>
    <div class="table-wrap">
      <div class="table-header">
        <h3>All Games</h3>
        <span id="gameTotal" style="font-size:13px;color:#888"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>Player</th><th>Day #</th><th>Result</th><th>Score</th><th>Guesses</th><th>Completed</th>
          </tr></thead>
          <tbody id="gameTableBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="gamePagination"></div>
    </div>
  </div>
</div>

<script>
// ── State ──
let adminKey = sessionStorage.getItem('physiodle_admin_key') || '';
const state = { currentDay: 1, viewDay: 1, totalPuzzles: 0, puzzleCache: {} };

// ── API helper ──
async function api(path) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(`/api/admin${path}${sep}key=${encodeURIComponent(adminKey)}`);
  if (res.status === 403) { doLogout(); throw new Error('Unauthorized'); }
  return res.json();
}

// ── Login / Logout ──
async function doLogin() {
  adminKey = document.getElementById('adminKeyInput').value.trim();
  try {
    await api('/stats');
    sessionStorage.setItem('physiodle_admin_key', adminKey);
    showDashboard();
  } catch {
    document.getElementById('loginError').textContent = 'Invalid admin key';
    document.getElementById('loginError').style.display = 'block';
  }
}
function doLogout() {
  adminKey = '';
  sessionStorage.removeItem('physiodle_admin_key');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

// ── Init ──
document.getElementById('adminKeyInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

if (adminKey) {
  api('/stats').then(() => showDashboard()).catch(() => {
    document.getElementById('loginScreen').style.display = 'flex';
  });
} else {
  document.getElementById('loginScreen').style.display = 'flex';
}

async function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadOverview();
  loadPuzzles();
}

// ── Tab switching ──
document.querySelectorAll('.admin-nav .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.admin-nav .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');

    if (tab.dataset.panel === 'users') loadUsers(1);
    if (tab.dataset.panel === 'games') loadGames(1);
    if (tab.dataset.panel === 'puzzles') loadPuzzles();
  });
});

// ── Overview ──
async function loadOverview() {
  const s = await api('/stats');
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="label">Total Users</div><div class="value">${s.totalUsers}</div></div>
    <div class="stat-card"><div class="label">Total Games</div><div class="value">${s.totalGamesPlayed}</div></div>
    <div class="stat-card"><div class="label">Games Today</div><div class="value">${s.gamesToday}</div></div>
    <div class="stat-card"><div class="label">Overall Win Rate</div><div class="value">${s.winRate}%</div></div>
  `;
}

// ── Users ──
async function loadUsers(page) {
  const data = await api(`/users?page=${page}&limit=50`);
  document.getElementById('userTotal').textContent = `${data.total} total users`;
  document.getElementById('userTableBody').innerHTML = data.users.map(u => `
    <tr>
      <td>${u.id}</td>
      <td><strong>${esc(u.username)}</strong></td>
      <td>${fmtDate(u.createdAt)}</td>
      <td>${u.gamesPlayed}</td>
      <td>${u.gamesWon}</td>
      <td>${u.winRate}%</td>
      <td>${u.totalPoints}</td>
    </tr>
  `).join('');
  renderPagination('userPagination', data.page, data.totalPages, loadUsers);
}

// ── Games ──
async function loadGames(page) {
  const data = await api(`/games?page=${page}&limit=50`);
  document.getElementById('gameTotal').textContent = `${data.total} total games`;
  document.getElementById('gameTableBody').innerHTML = data.games.map(g => `
    <tr>
      <td><strong>${esc(g.username)}</strong></td>
      <td>Day ${g.dayNumber}</td>
      <td>${g.won ? '<span class="badge badge-green">Won</span>' : '<span class="badge badge-red">Lost</span>'}</td>
      <td>${g.won ? g.score + '/5' : '—'}</td>
      <td style="font-size:12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${g.guesses.map(x => typeof x === 'string' ? x : (x.text || x.guess || JSON.stringify(x))).join(', ')}</td>
      <td>${fmtDate(g.completedAt)}</td>
    </tr>
  `).join('');
  renderPagination('gamePagination', data.page, data.totalPages, loadGames);
}

// ── Pagination renderer ──
function renderPagination(containerId, currentPage, totalPages, loadFn) {
  const el = document.getElementById(containerId);
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = `<button ${currentPage <= 1 ? 'disabled' : ''} onclick="void(0)">« Prev</button>`;
  const start = Math.max(1, currentPage - 3);
  const end = Math.min(totalPages, currentPage + 3);
  for (let i = start; i <= end; i++) {
    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="void(0)">${i}</button>`;
  }
  html += `<button ${currentPage >= totalPages ? 'disabled' : ''} onclick="void(0)">Next »</button>`;
  html += `<span class="page-info">${currentPage} / ${totalPages}</span>`;
  el.innerHTML = html;
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.textContent.trim();
      if (text === '« Prev' && currentPage > 1) loadFn(currentPage - 1);
      else if (text === 'Next »' && currentPage < totalPages) loadFn(currentPage + 1);
      else if (!isNaN(text)) loadFn(parseInt(text));
    });
  });
}

// ── Puzzle Vetting ──
async function loadPuzzles(startDay) {
  const data = await api(`/puzzles?startDay=${startDay || ''}&count=10`);
  state.currentDay = data.currentDay;
  state.totalPuzzles = data.totalPuzzles;
  if (!startDay) state.viewDay = data.currentDay;
  else state.viewDay = data.startDay;

  document.getElementById('dayInput').value = state.viewDay;
  document.getElementById('puzzleDayInfo').textContent =
    `Current day: ${state.currentDay} | Total puzzles: ${state.totalPuzzles}`;

  const container = document.getElementById('puzzleContainer');

  // Check for similar puzzles within 50 days
  const similarWarnings = findSimilarNearby(data.puzzles, state.viewDay);

  container.innerHTML = data.puzzles.map(p => {
    const isPast = p.dayNumber < state.currentDay;
    const isToday = p.dayNumber === state.currentDay;
    const isFuture = p.dayNumber > state.currentDay;
    const dayLabel = isToday ? 'TODAY' : isPast ? 'Past' : `In ${p.dayNumber - state.currentDay} days`;
    const warning = similarWarnings[p.dayNumber];

    return `
      ${warning ? `<div class="puzzle-pair-warning">⚠️ <strong>Similar puzzle nearby:</strong> ${warning}</div>` : ''}
      <div class="puzzle-card" style="${isToday ? 'border:2px solid #0d9488' : ''}">
        <div class="puzzle-header">
          <div>
            <div class="puzzle-title">${esc(p.answer)}</div>
            <div class="aliases">${p.aliases.length ? 'Aliases: ' + p.aliases.map(esc).join(', ') : 'No aliases'}</div>
          </div>
          <div class="puzzle-meta">
            <span class="badge ${isToday ? 'badge-green' : isPast ? 'badge-blue' : 'badge-yellow'}">Day ${p.dayNumber} — ${dayLabel}</span>
            <span class="badge badge-blue">${esc(p.category)}</span>
            <span class="badge ${p.difficulty === 'hard' ? 'badge-red' : p.difficulty === 'easy' ? 'badge-green' : 'badge-yellow'}">${p.difficulty}</span>
            <span style="font-size:12px;color:#888">${p.date}</span>
          </div>
        </div>
        ${p.clues.map((c, i) => `
          <div class="clue">
            <div class="clue-label">Clue ${i+1}: ${esc(c.label)}</div>
            <div class="clue-text">${esc(c.text)}</div>
          </div>
        `).join('')}
        <div class="explanation"><strong>Explanation:</strong> ${esc(p.explanation || 'None')}</div>
      </div>
    `;
  }).join('');
}

function findSimilarNearby(puzzles, viewDay) {
  // We need a wider window to detect similarity. Cache what we have.
  // For now, check within the loaded batch for same-category or same-answer-stem
  const warnings = {};
  for (let i = 0; i < puzzles.length; i++) {
    for (let j = i + 1; j < puzzles.length; j++) {
      const a = puzzles[i], b = puzzles[j];
      const dayGap = Math.abs(a.dayNumber - b.dayNumber);
      if (dayGap > 50) continue;

      const aWords = a.answer.toLowerCase().split(/[\s\-]+/);
      const bWords = b.answer.toLowerCase().split(/[\s\-]+/);
      const shared = aWords.filter(w => bWords.includes(w) && w.length > 3);

      if (a.category === b.category && shared.length >= 1) {
        const msg = `"${a.answer}" (Day ${a.dayNumber}) and "${b.answer}" (Day ${b.dayNumber}) are both ${a.category} — only ${dayGap} days apart`;
        warnings[a.dayNumber] = msg;
        warnings[b.dayNumber] = msg;
      }
    }
  }
  return warnings;
}

function puzzleNav(delta) {
  const newDay = Math.max(1, state.viewDay + delta);
  state.viewDay = newDay;
  loadPuzzles(newDay);
}

function jumpToDay(day) {
  const d = Math.max(1, parseInt(day) || 1);
  state.viewDay = d;
  loadPuzzles(d);
}

function jumpToDate(dateStr) {
  if (!dateStr) return;
  const launch = new Date('2026-03-04');
  const target = new Date(dateStr);
  const diff = Math.floor((target - launch) / 86400000) + 1;
  if (diff >= 1) jumpToDay(diff);
}

// ── Helpers ──
function esc(s) { const el = document.createElement('span'); el.textContent = s || ''; return el.innerHTML; }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); }
</script>
</body>
</html>
